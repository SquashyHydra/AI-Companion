# PC Companion configuration.
# Any value below can be overridden with an environment variable (see README).

llm:
  # LM Studio default. Any OpenAI-compatible server works.
  base_url: http://localhost:1234/v1
  # Use the identifier LM Studio shows for your loaded model.
  model: qwen3-8b
  # Local servers usually ignore the key, but the client requires one.
  api_key: lm-studio
  temperature: 0.7
  timeout_s: 60
  # Maximum tool-call round trips for a single user message.
  max_tool_rounds: 5
  # Context window in tokens. 0 reads the loaded size from LM Studio (falls back to 8192).
  context_tokens: 0
  # Summarize older turns once history passes this share of the window (0.3 to 0.95).
  compact_at: 0.7
  # Recent turns always kept word for word when older turns are summarized.
  keep_recent_turns: 4
  # Characters kept from a tool result before it is sent back to the model.
  max_tool_result_chars: 2000
  # Upper limit on the summary text that replaces older turns.
  max_summary_chars: 1500
  # Retries when the LLM server is unreachable, with a growing delay in seconds.
  connect_retries: 2
  retry_delay_s: 1.0

# Persona text is read from this file at the start of each conversation.
conversation:
  persona_file: data/persona.md
  # One plain-text transcript per conversation under logs/conversations/.
  log_enabled: true
  log_dir: logs/conversations

# Long-term memory: remember, recall, and forget tools. Listing is done by the app ("list my memories").
memory:
  enabled: true
  db_path: data/memory/memories.sqlite
  # How many matching memories are shown to the model for each turn.
  max_in_prompt: 5
  # Longest memory text accepted by remember.
  max_chars: 300
  # Save durable facts from finished turns in the background. Facts are listed as "[noted: ...]".
  auto_save: true
  # Also speak the "[noted: ...]" line for automatic saves.
  announce_auto: false
  # Synonym recall with a small CPU embedding model (about 70 MB, downloaded on first use).
  # When false, or when the model cannot load, recall uses keywords only.
  embeddings: true
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_cache: data/models
  # Cosine similarity a memory needs to count as related (0 to 1).
  semantic_min_score: 0.55

tools:
  # Relative paths are resolved from the project root.
  notes_dir: data/notes
  # JSON allowlist of apps the companion may open (friendly name -> path or steam:// URL).
  apps_file: data/apps.json
  # Folders that find_file, open_file, and play_media may use. Nothing outside these folders can be opened.
  # Shortcuts (documents, desktop, downloads, videos, music) follow your Windows folder settings, such as OneDrive.
  # Full paths also work. A missing folder is reported at startup with a suggestion.
  file_roots:
    - documents
    - desktop
    - downloads
    - videos
    - music

# Web search. Only the query text is sent, to DuckDuckGo, over the internet. Each query is logged to logs/searches.log.
search:
  # Turn web search on or off.
  enabled: true
  # The companion searches on its own when it needs current or missing information.
  # "search for X" and "look up X" always search, even when this is false.
  auto: true
  # Searches allowed in one user turn. Range 1 to 10.
  max_per_turn: 2
  # Seconds to wait for each search. Range 1 to 60.
  timeout_s: 8
  # Results per search. Range 1 to 10.
  results: 5

timers:
  # JSON file that keeps running timers and reminders across restarts. Empty keeps them in memory only.
  store_file: data/timers.json
  # A timer that came due while the companion was closed is announced once at startup.
  announce_missed: true

files:
  # How often the file index is rebuilt in the background, in minutes. 0 turns refreshes off.
  # Use rescan_files to rebuild it on demand.
  index_refresh_minutes: 30
  # Ask before playing or opening music and video. Folders and documents always ask.
  confirm_media: false
  # Extensions play_media and open_file treat as media.
  media_extensions: [.mp3, .flac, .wav, .m4a, .aac, .ogg, .opus, .wma, .mp4, .mkv, .avi, .mov, .webm, .m4v]
  # Never opened, even inside a file root. Code and programs are blocked by default.
  blocked_extensions: [.exe, .bat, .cmd, .com, .ps1, .psm1, .msi, .msp, .vbs, .vbe, .js, .jse, .wsf, .wsh, .scr, .reg, .lnk, .hta, .cpl, .dll, .jar, .msc, .url, .py]
  # Most tracks a playlist from one folder will load. Range 1 to 1000.
  playlist_max_tracks: 200

input:
  # continuous: always listening, hands-free, with barge-in.
  # push_to_talk: press Enter to start and stop each recording.
  # text: typing only.
  mode: continuous
  # Seconds to answer a confirmation (yes or no). No answer counts as no. Range 5 to 300.
  confirm_timeout_s: 30
  # Optional wake word for continuous mode. Needs: pip install openwakeword (downloads a model once).
  wake_word:
    enabled: false
    # Name of an openWakeWord model, for example hey_jarvis.
    model: hey_jarvis
    # Detection score from 0.05 to 0.99. Higher means fewer false triggers.
    threshold: 0.5
    # Seconds after the wake word during which speech is heard without repeating it. Range 2 to 60.
    window_s: 8
    # Seconds after a reply finishes when you can speak again without the wake word. 0 turns it off.
    follow_up_s: 8

audio:
  # Speech input. Set to false for text-only chat (same as input.mode: text).
  enabled: true
  # null uses the default microphone. Or a device number from /mics, or part of its name.
  # 50 (SteelSeries Sonar - Microphone) hears the reply playing on Sonar Chat; 48 did not in a test.
  input_device: 50
  # faster-whisper model: tiny, base, small, medium, large-v3. Downloaded on first use.
  whisper_model: medium
  # cuda uses the GPU. cpu works without one.
  whisper_device: cuda
  # float16 for cuda. Use int8 for cpu.
  whisper_compute_type: float16
  # Language code such as en, or null to auto-detect.
  language: en
  # Silero VAD speech threshold, 0 to 1. Higher ignores more quiet sounds.
  # Silero is the only VAD. faster-whisper's built-in vad_filter is off.
  vad_threshold: 0.8
  # Utterances shorter than this many seconds are ignored (push-to-talk).
  min_seconds: 0.3

  # Continuous listening settings.
  # Audio kept from before the detected start of speech, so first words are not cut off.
  pre_roll_ms: 400
  # Speech shorter than this is treated as a cough or click and ignored.
  min_speech_ms: 250
  # Silence that ends an utterance. Lower is faster but cuts off pauses mid-sentence.
  end_silence_ms: 900
  # Longest single utterance before it is cut and sent.
  max_utterance_s: 45
  # Speech for this long while the companion is talking or thinking interrupts it.
  barge_in_ms: 900

  # Transcription settings.
  # Beam search width. Higher is slower and sometimes more accurate.
  beam_size: 5
  # Words or phrases Whisper should expect (names, product words, jargon).
  vocabulary: []
  # Also add the names in data/apps.json to the vocabulary.
  include_app_names: true
  # Also add artist and album folder names from your Music and Videos folders (from the file index).
  include_file_names: true
  # Use the vocabulary as hotwords too. Can make Whisper over-insist on these words.
  use_hotwords: false
  # Average log-probability below this marks a transcript as low confidence.
  low_confidence_logprob: -1.0

  # Debug: save each utterance as a WAV file in utterance_dir.
  save_utterances: false
  utterance_dir: logs/utterances

  # Speech output (voice mode only; typed and push-to-talk modes stay silent).
  # Speak replies aloud, sentence by sentence. The engine is chosen in the tts section below.
  speak_replies: true
  # headphones: barge-in works hands-free (you can talk over the reply to interrupt it).
  # speakers: the mic is muted while the reply plays (plus the tail below), so barge-in is off.
  output_mode: headphones
  # Output device: empty for the Windows default, a number from the diagnostic, or part of a name.
  # WASAPI outputs only. Run: python -m companion.diagnose_tts
  output_device:
  # Piper voice model (.onnx), used when tts.engine is piper or Chatterbox cannot start.
  # Its .json config must sit next to it.
  voice_path: data/voices/en_US-lessac-medium.onnx
  # Piper only: 0.5 to 2.0. 1.0 is normal speed. Chatterbox engines have no speed control and ignore it.
  speech_speed: 1.0
  # speakers mode only: keep the mic muted this many ms after the last sample, for room echo.
  speakers_tail_ms: 400

tts:
  # chatterbox_turbo: Resemble AI's Chatterbox-Turbo (350M, English). Renders [laugh], [chuckle],
  #   [cough] and other tags. Runs in a separate process from .venv-tts.
  # chatterbox_nano: Resemble AI's Chatterbox-Nano (110M, English). Smaller and faster to load.
  #   Renders the tags its model lists (read from the model at startup).
  # piper: Piper voice from audio.voice_path. CPU only, no voice tags.
  # If a Chatterbox engine cannot start, the app falls back to Piper and says so.
  engine: chatterbox_nano
  # cuda uses the GPU. cpu works without one but is much slower. Applies to Chatterbox engines.
  device: cuda
  # true: the Chatterbox server uses only the local model cache (HF_HUB_OFFLINE=1).
  # The first run needs a download, so set this to false once, then back to true.
  offline: true
  # Words of the first sentence before speech starts. The first chunk is cut early at a clause
  # boundary or after this many words. 0 turns the early cut off.
  first_chunk_words: 7
  chatterbox:
    # Python of the .venv-tts environment that runs the server (relative to the project root).
    python: .venv-tts/Scripts/python.exe
    # Localhost only (127.0.0.1 or localhost).
    host: 127.0.0.1
    port: 8765
    # Empty uses the built-in voice. Or a clip of at least 5 seconds (WAV), relative to the project root.
    voice_reference:
    # true: the companion starts and stops the server itself.
    # false: run the server yourself (see README) and set host and port to match.
    autostart: true
    # Maximum seconds to wait for the model to load (the first run also downloads it).
    startup_timeout_s: 300
    # Maximum seconds for one sentence to render.
    request_timeout_s: 60

display:
  # true: show voice tags such as [laugh] on screen. false: hide the tags that the voice renders.
  show_voice_tags: true
  # true: show a system tray icon in voice mode (Quit, open logs). Same as starting with --tray.
  tray_icon: true
